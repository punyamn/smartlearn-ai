<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLearn AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SmartLearn AI</h1>
        <h2>Instant Study Guide & Quiz Generator</h2>
        <p>Paste your notes below to generate summaries and an interactive quiz.</p>

        {% if error %}
            <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form action="/generate" method="POST">
            <label for="raw_notes">RAW STUDY NOTES</label>
            <textarea id="raw_notes" name="raw_notes" placeholder="Paste lecture notes or textbook chapters here..."></textarea>
            <button type="submit">+ Generate Study Guide</button>
        </form>
    </div>
</body>
</html>
