<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLearn AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>SmartLearn AI</h1>
        <h2>Instant Study Guide & Quiz Generator</h2>

        {% if error %}
            <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form action="/generate" method="POST">
            <label for="raw_notes">Raw Study Notes</label>
            <textarea id="raw_notes" name="raw_notes" placeholder="Paste your lecture notes, textbook chapters, or summary paragraphs here..."></textarea>
            <button type="submit">✨ Generate Study Guide</button>
        </form>
    </div>
</body>
</html>
