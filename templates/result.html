<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Guide - SmartLearn AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Generated Study Guide</h1>
        <h2>Key Summaries & Practice Quiz</h2>

        <h3>📌 Core Takeaways</h3>
        <ul class="summary-list">
            {% for item in summary %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>

        <h3>📝 Quick Quiz</h3>
        {% for q in quiz %}
            <div class="quiz-card">
                <p><strong>Q{{ loop.index }}: {{ q.question }}</strong></p>
                <div class="options-grid">
                    {% for opt in q.options %}
                        <div class="option-item">{{ opt }}</div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}

        <br><br>
        <a href="/" class="btn">← Back to Notes</a>
    </div>
</body>
</html>
